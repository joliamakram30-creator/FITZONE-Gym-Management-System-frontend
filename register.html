<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join FITZONE - Member Registration</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      background: linear-gradient(135deg, #060810 0%, #0f131f 100%),
                  url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1600&auto=format&fit=crop&q=80') center/cover no-repeat;
      background-blend-mode: multiply;
    }

    .auth-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 35%, rgba(255, 94, 20, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-container {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    .auth-box {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid rgba(255, 94, 20, 0.2);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 94, 20, 0.1);
      animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .brand-logo-icon {
      animation: logoPulse 3s ease-in-out infinite;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 94, 20, 0.15);
    }

    .btn-register {
      width: 100%;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.85rem;
      margin-top: 1rem;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes logoPulse {
      0%, 100% {
        box-shadow: 0 4px 16px rgba(255, 94, 20, 0.4);
      }
      50% {
        box-shadow: 0 4px 32px rgba(255, 94, 20, 0.7);
      }
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-bg-overlay"></div>

  <div class="auth-container">
    <div class="auth-box">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-logo-icon" style="margin: 0 auto 0.75rem; width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <h2 style="font-size: 1.6rem; letter-spacing: 0.5px;">START YOUR <span class="text-primary">JOURNEY</span></h2>
        <p class="text-secondary" style="font-size: 0.85rem; margin-top: 0.2rem;">Create your FITZONE member account</p>
      </div>

      <form id="register-form" onsubmit="handleRegistration(event)">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Karim El-Masry" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="karim@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+20 100 123 4567" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 chars" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat password" required minlength="6">
          </div>
        </div>

        <div class="form-group" style="margin-top: 0.5rem;">
          <label style="display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" required style="accent-color: var(--primary); margin-top: 3px;">
            <span>I agree to FITZONE's gym rules, safety guidelines, and membership terms.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-register">
          <i class="fa-solid fa-user-plus"></i> Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); font-size: 0.88rem; color: var(--text-secondary);">
        Already a member? <a href="login.html" class="text-primary font-bold">Sign In here</a>
      </div>

      <div style="text-align: center; margin-top: 1rem;">
        <a href="index.html" class="text-muted" style="font-size: 0.82rem;"><i class="fa-solid fa-arrow-left"></i> Back to FITZONE Website</a>
      </div>
    </div>

    <!-- Decorative branding footer -->
    <div style="text-align:center; margin-top:2rem; font-size:0.78rem; color:rgba(255,255,255,0.3); letter-spacing:1px; text-transform:uppercase;">
      © 2024 FITZONE — Premium Gym Management
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function handleRegistration(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      const res = Auth.register({ name, email, phone, password, confirmPassword });
      if (res.success) {
        App.showToast(`Welcome to FITZONE, ${name}! Your membership pass has been generated.`, "success");
        setTimeout(() => {
          window.location.href = 'client/my-dashboard.html';
        }, 800);
      } else {
        App.showToast(res.message, "error");
      }
    }
  </script>
</body>
</html>
